<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Anarchivo: tres áreas de concepto que se solapan (como en el grafo) y un hilo bermellón entre obras -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262624"/>
      <stop offset="1" stop-color="#121211"/>
    </linearGradient>
    <clipPath id="caja"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#fondo)"/>
  <g clip-path="url(#caja)">
    <!-- trama de puntos de la Mesa -->
    <g fill="#ecece8" opacity=".07">
      <circle cx="180" cy="180" r="5"/><circle cx="260" cy="180" r="5"/><circle cx="340" cy="180" r="5"/><circle cx="420" cy="180" r="5"/><circle cx="500" cy="180" r="5"/><circle cx="580" cy="180" r="5"/><circle cx="660" cy="180" r="5"/><circle cx="740" cy="180" r="5"/><circle cx="820" cy="180" r="5"/>
      <circle cx="180" cy="844" r="5"/><circle cx="260" cy="844" r="5"/><circle cx="340" cy="844" r="5"/><circle cx="420" cy="844" r="5"/><circle cx="500" cy="844" r="5"/><circle cx="580" cy="844" r="5"/><circle cx="660" cy="844" r="5"/><circle cx="740" cy="844" r="5"/><circle cx="820" cy="844" r="5"/>
    </g>
    <!-- áreas -->
    <g fill="#ecece8" fill-opacity=".05" stroke="#9a9a92" stroke-width="7" stroke-dasharray="4 16" stroke-linecap="round">
      <ellipse cx="420" cy="440" rx="215" ry="200" transform="rotate(-18 420 440)"/>
      <ellipse cx="610" cy="470" rx="205" ry="185" transform="rotate(14 610 470)"/>
      <ellipse cx="505" cy="635" rx="230" ry="175" transform="rotate(-4 505 635)"/>
    </g>
    <!-- el hilo -->
    <polyline points="330,395 470,330 520,520 690,455 600,690 410,665" fill="none" stroke="#DA3A16" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>
    <!-- obras -->
    <g fill="#77776f">
      <circle cx="285" cy="560" r="13"/><circle cx="745" cy="590" r="13"/><circle cx="560" cy="300" r="11"/><circle cx="450" cy="760" r="11"/><circle cx="640" cy="780" r="10"/>
    </g>
    <g fill="#DA3A16">
      <circle cx="330" cy="395" r="22"/><circle cx="470" cy="330" r="18"/><circle cx="520" cy="520" r="30"/><circle cx="690" cy="455" r="20"/><circle cx="600" cy="690" r="22"/><circle cx="410" cy="665" r="17"/>
    </g>
    <circle cx="520" cy="520" r="11" fill="#161615"/>
  </g>
</svg>
